<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LogiFlow — Supply Chain Workspace</title>
<style>
:root{
 --primary:#788B76;--primary-dark:#526650;--primary-soft:#E7EDE3;
 --bg:#F7F5ED;--surface:#FFFEFA;--surface-2:#F0EFE7;--text:#29332B;
 --muted:#788078;--line:#E4E5DC;--accent:#C5A879;--danger:#B85C52;
 --warning:#B78339;--success:#5D8062;--radius:18px;--shadow:0 12px 35px rgba(44,57,43,.07);
 --space:16px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}
.sidebar{background:var(--surface);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:42px;height:42px;border-radius:14px;background:var(--primary-dark);color:white;display:grid;place-items:center;font-weight:800;font-size:17px;letter-spacing:-1px}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.6px}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
.nav-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;padding:0 12px;margin-bottom:8px;font-weight:700}
.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:var(--muted);padding:11px 12px;border-radius:12px;text-align:left;display:flex;gap:12px;align-items:center;font-weight:600;transition:.18s}
.nav button:hover{background:var(--surface-2);color:var(--text)}.nav button.active{background:var(--primary-soft);color:var(--primary-dark)}
.nav-icon{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.workspace-card{background:var(--surface-2);border-radius:15px;padding:14px}.workspace-card strong{display:block;font-size:12px}.workspace-card span{font-size:11px;color:var(--muted)}
.main{min-width:0}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:rgba(255,254,250,.76);backdrop-filter:blur(12px);position:sticky;top:0;z-index:5}
.crumb{font-size:12px;color:var(--muted)}.top-title{font-size:16px;font-weight:750;margin-top:3px}.top-actions{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-dark);font-weight:800}
.content{max-width:1500px;margin:auto;padding:30px 34px 50px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{color:var(--primary-dark);font-size:10px;letter-spacing:1.7px;text-transform:uppercase;font-weight:800}.page-head h1{font-size:29px;letter-spacing:-1.2px;margin:7px 0 5px}.page-head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:10px 14px;border-radius:11px;font-weight:650;font-size:12px;transition:.18s}.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}.btn.primary{background:var(--primary-dark);border-color:var(--primary-dark);color:#fff}.btn.soft{background:var(--primary-soft);border-color:transparent;color:var(--primary-dark)}.btn.danger{color:var(--danger)}
.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:19px;box-shadow:0 3px 14px rgba(44,57,43,.025);min-width:0}
.kpi-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;font-weight:650}.kpi-icon{width:34px;height:34px;border-radius:11px;background:var(--primary-soft);display:grid;place-items:center;font-size:16px}.kpi-value{font-size:28px;font-weight:800;letter-spacing:-1.2px;margin:13px 0 4px}.kpi-note{font-size:11px;color:var(--muted)}
.two-col{grid-template-columns:1.4fr 1fr}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px}.card-head h3{margin:0;font-size:14px;letter-spacing:-.2px}.card-head small{color:var(--muted);font-size:11px}
.chart-wrap{height:220px;display:flex;align-items:flex-end;gap:12px;padding:15px 4px 24px;border-bottom:1px solid var(--line);position:relative}
.bar-group{height:100%;flex:1;display:flex;align-items:flex-end;gap:4px;position:relative}.bar{flex:1;min-width:5px;border-radius:6px 6px 2px 2px;background:var(--primary);opacity:.9}.bar.alt{background:#D5C6A8}.bar-label{position:absolute;bottom:-22px;left:0;right:0;text-align:center;color:var(--muted);font-size:10px}
.legend{display:flex;gap:16px;margin-top:16px;color:var(--muted);font-size:11px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--primary)}.dot.alt{background:#D5C6A8}
.list{display:grid;gap:0}.list-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);gap:12px}.list-row:last-child{border-bottom:0}.item-main{min-width:0}.item-main strong{font-size:12px;display:block}.item-main span{font-size:11px;color:var(--muted)}
.status{display:inline-flex;align-items:center;padding:5px 9px;border-radius:30px;font-size:10px;font-weight:750;white-space:nowrap;background:var(--surface-2);color:var(--muted)}.status.good{background:#E6F0E6;color:#4E7554}.status.warn{background:#F7EEDC;color:#956A2E}.status.bad{background:#F7E6E3;color:#A34E45}.status.info{background:#E8EDF2;color:#526A80}
.table-card{padding:0;overflow:hidden}.table-toolbar{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{border:1px solid var(--line);background:var(--surface);padding:9px 12px;border-radius:10px;min-width:210px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(120,139,118,.12);outline:none}
.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:700px}th{text-align:left;padding:12px 18px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px;background:#FAF9F4}td{padding:14px 18px;border-top:1px solid var(--line);font-size:12px}td strong{font-weight:700}td .sub{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:var(--muted)}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}.field textarea{min-height:92px;resize:vertical}
.modal-backdrop{position:fixed;inset:0;background:rgba(25,34,27,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--surface);border-radius:20px;padding:22px;box-shadow:0 25px 80px rgba(0,0,0,.2)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:18px}.x{border:0;background:var(--surface-2);border-radius:9px;width:32px;height:32px}
.prompt-layout{display:grid;grid-template-columns:260px 1fr;gap:16px}.template-list{display:grid;gap:8px}.template{border:1px solid var(--line);background:var(--surface);padding:12px;border-radius:12px;text-align:left}.template.active{border-color:var(--primary);background:var(--primary-soft)}.template strong{display:block;font-size:12px}.template span{font-size:10px;color:var(--muted)}.prompt-output{background:#F4F3EC;border:1px solid var(--line);border-radius:14px;padding:16px;white-space:pre-wrap;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:250px;color:#374238}
.setting-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px}.color-row{display:grid;grid-template-columns:1fr 110px 120px;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.color-row input[type=color]{width:42px;height:34px;border:0;background:none;padding:0}.color-row input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:11px}
.preview{border:1px dashed var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}.preview-head{padding:12px;background:var(--surface);border-bottom:1px solid var(--line);font-weight:750}.preview-body{padding:15px;display:grid;gap:10px}.preview-tile{padding:13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:11px}.preview-button{padding:8px 11px;border-radius:8px;background:var(--primary-dark);color:white;display:inline-block;font-size:10px}
.notice{border-radius:12px;padding:12px 14px;background:var(--primary-soft);color:var(--primary-dark);font-size:11px;line-height:1.5}.muted{color:var(--muted)}.pill{border-radius:20px;background:var(--surface-2);padding:5px 8px;font-size:10px;color:var(--muted)}.progress{height:7px;background:var(--surface-2);border-radius:10px;overflow:hidden}.progress span{display:block;height:100%;background:var(--primary);border-radius:10px}.mobile-menu{display:none}
body.compact .card{padding:13px}body.compact .content{padding-top:22px}body.spacious .card{padding:25px}body.topnav .app{grid-template-columns:1fr}body.topnav .sidebar{position:relative;height:auto;display:flex;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px 22px}body.topnav .sidebar .nav-label,body.topnav .side-bottom{display:none}body.topnav .nav{display:flex;flex-wrap:wrap}body.topnav .sidebar>div:nth-child(2){flex:1}
@media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.two-col{grid-template-columns:1fr}.prompt-layout{grid-template-columns:1fr}.template-list{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:-270px;top:0;width:250px;z-index:10;transition:.2s;box-shadow:var(--shadow)}.sidebar.open{left:0}.topbar{padding:0 16px;height:66px}.content{padding:22px 15px 40px}.page-head{align-items:flex-start;flex-direction:column}.page-head h1{font-size:25px}.kpis{gap:10px}.kpi-value{font-size:23px}.card{padding:15px}.setting-layout{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.mobile-menu{display:inline-flex}.top-actions .hide-mobile{display:none}.color-row{grid-template-columns:1fr 45px 100px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-mark" id="brandMark">L.</div><div><div class="brand-name" id="brandName">LogiFlow</div><div class="brand-sub" id="brandSub">Supply chain workspace</div></div></div>
 <div><div class="nav-label">Workspace</div><nav class="nav" id="nav"></nav></div>
 <div class="side-bottom"><div class="workspace-card"><strong id="workspaceLabel">Operations workspace</strong><span>Demo environment · Sample data</span></div></div>
</aside>
<main class="main">
 <header class="topbar"><div><button class="btn mobile-menu" onclick="toggleMenu()">☰</button><div class="crumb">Workspace / <span id="crumb">Overview</span></div><div class="top-title" id="topTitle">Good morning, team</div></div><div class="top-actions"><span class="pill hide-mobile">DEMO ENVIRONMENT</span><button class="btn hide-mobile" onclick="navigate('settings')">⚙ Settings</button><div class="avatar">LF</div></div></header>
 <section class="content" id="content"></section>
</main>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="x" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div>
<script>
const DEFAULTS={
 primary:'#788B76',dark:'#526650',soft:'#E7EDE3',bg:'#F7F5ED',surface:'#FFFEFA',text:'#29332B',
 brand:'LogiFlow',descriptor:'Supply chain workspace',mark:'L.',workspace:'Operations workspace',layout:'sidebar',spacing:'comfortable',
 nav:[['dashboard','⌂','Overview',true],['inventory','▦','Inventory',true],['orders','▤','Orders',true],['customers','♙','Customers',true],['deliveries','⇢','Deliveries',true],['assistant','✧','AI Prompt Lab',true],['reports','▥','Reports',true],['settings','⚙','Settings',true]]
};
let settings=JSON.parse(localStorage.getItem('lf3_settings')||'null')||structuredClone(DEFAULTS);
let data=JSON.parse(localStorage.getItem('lf3_data')||'null');
if(!data)data=seedData();
let current='dashboard',activeTemplate='stock',promptText='';
function seedData(){return{
 customers:[
 {id:'CUS-1001',name:'Maya Santos',company:'Northstar Retail',email:'maya@northstar.example',phone:'0917-000-1001',orders:3},
 {id:'CUS-1002',name:'Liam Reyes',company:'Harbor & Co.',email:'liam@harbor.example',phone:'0917-000-1002',orders:2},
 {id:'CUS-1003',name:'Ava Dela Cruz',company:'Evergreen Market',email:'ava@evergreen.example',phone:'0917-000-1003',orders:4},
 {id:'CUS-1004',name:'Noah Garcia',company:'Studio Supply',email:'noah@studio.example',phone:'0917-000-1004',orders:1}],
 inventory:[
 {id:'SKU-001',name:'Kraft Shipping Boxes',category:'Packaging',stock:120,reorder:40,cost:18,supplier:'PackRight Supplies'},
 {id:'SKU-002',name:'Reusable Pouch — Small',category:'Finished goods',stock:24,reorder:30,cost:55,supplier:'In-house'},
 {id:'SKU-003',name:'Protective Wrap Roll',category:'Packaging',stock:76,reorder:25,cost:32,supplier:'EcoWrap Trading'},
 {id:'SKU-004',name:'Canvas Tote — Natural',category:'Finished goods',stock:12,reorder:20,cost:95,supplier:'In-house'},
 {id:'SKU-005',name:'Shipping Labels',category:'Office supplies',stock:210,reorder:50,cost:4,supplier:'PrintHub'}],
 orders:[
 {id:'ORD-2401',customer:'Maya Santos',date:'2026-11-12',items:'Kraft Shipping Boxes × 3',total:540,status:'Processing',priority:'High'},
 {id:'ORD-2402',customer:'Liam Reyes',date:'2026-11-13',items:'Reusable Pouch — Small × 2',total:220,status:'Pending',priority:'Normal'},
 {id:'ORD-2403',customer:'Ava Dela Cruz',date:'2026-11-13',items:'Canvas Tote — Natural × 4',total:760,status:'Packed',priority:'High'},
 {id:'ORD-2404',customer:'Noah Garcia',date:'2026-11-14',items:'Protective Wrap Roll × 2',total:320,status:'Completed',priority:'Normal'}],
 deliveries:[
 {id:'SHP-8101',order:'ORD-2401',customer:'Maya Santos',destination:'Muntinlupa City',eta:'2026-11-16',carrier:'SwiftRoute Demo',status:'Preparing'},
 {id:'SHP-8102',order:'ORD-2403',customer:'Ava Dela Cruz',destination:'Makati City',eta:'2026-11-16',carrier:'ParcelWay Demo',status:'In transit'},
 {id:'SHP-8103',order:'ORD-2404',customer:'Noah Garcia',destination:'Taguig City',eta:'2026-11-15',carrier:'SwiftRoute Demo',status:'Delivered'}],
 activity:[{title:'Order ORD-2404 completed',detail:'Noah Garcia · Sample transaction',time:'Today, 9:20 AM'},{title:'Stock alert: Canvas Tote — Natural',detail:'12 units remaining · Reorder point: 20',time:'Today, 8:45 AM'},{title:'Shipment SHP-8102 updated',detail:'In transit · Makati City',time:'Yesterday'}],
 movements:[]
};}
function persist(){localStorage.setItem('lf3_data',JSON.stringify(data));localStorage.setItem('lf3_settings',JSON.stringify(settings))}
function money(n){return '₱'+Number(n||0).toLocaleString('en-PH',{maximumFractionDigits:0})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyTheme(){let r=document.documentElement.style;r.setProperty('--primary',settings.primary);r.setProperty('--primary-dark',settings.dark);r.setProperty('--primary-soft',settings.soft);r.setProperty('--bg',settings.bg);r.setProperty('--surface',settings.surface);r.setProperty('--text',settings.text);document.body.classList.toggle('compact',settings.spacing==='compact');document.body.classList.toggle('spacious',settings.spacing==='spacious');document.body.classList.toggle('topnav',settings.layout==='top');document.getElementById('brandName').textContent=settings.brand;document.getElementById('brandSub').textContent=settings.descriptor;document.getElementById('brandMark').textContent=settings.mark;document.getElementById('workspaceLabel').textContent=settings.workspace}
function renderNav(){document.getElementById('nav').innerHTML=settings.nav.filter(x=>x[3]).map(x=>`<button class="${current===x[0]?'active':''}" onclick="navigate('${x[0]}')"><span class="nav-icon">${esc(x[1])}</span>${esc(x[2])}</button>`).join('')}
function navigate(p){current=p;document.getElementById('sidebar').classList.remove('open');renderNav();renderPage()}
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open')}
function pageHead(kicker,title,desc,buttons=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
function card(title,body,extra=''){return `<div class="card"><div class="card-head"><h3>${title}</h3>${extra}</div>${body}</div>`}
function status(s){let cls=({Completed:'good',Delivered:'good',Packed:'info','In transit':'info',Processing:'warn',Pending:'warn',Preparing:'warn',Cancelled:'bad',High:'bad',Normal:'good'})[s]||'';return `<span class="status ${cls}">${esc(s)}</span>`}
function renderPage(){document.getElementById('crumb').textContent=({dashboard:'Overview',inventory:'Inventory',orders:'Orders',customers:'Customers',deliveries:'Deliveries',assistant:'AI Prompt Lab',reports:'Reports',settings:'Settings'})[current];document.getElementById('topTitle').textContent=({dashboard:'Good morning, team',inventory:'Inventory control',orders:'Order management',customers:'Customer directory',deliveries:'Delivery operations',assistant:'AI Prompt Lab',reports:'Business intelligence',settings:'Workspace preferences'})[current];let html=({dashboard:dashboardPage,inventory:inventoryPage,orders:ordersPage,customers:customersPage,deliveries:deliveriesPage,assistant:assistantPage,reports:reportsPage,settings:settingsPage})[current]();document.getElementById('content').innerHTML=html;renderNav()}
function dashboardPage(){
 let revenue=data.orders.filter(o=>o.status!=='Cancelled').reduce((a,o)=>a+o.total,0),pending=data.orders.filter(o=>['Pending','Processing','Packed'].includes(o.status)).length,low=data.inventory.filter(i=>i.stock<=i.reorder).length,delivered=data.deliveries.filter(d=>d.status==='Delivered').length;
 let months=['Jun','Jul','Aug','Sep','Oct','Nov'],vals=[3200,4100,3700,5200,4900,revenue];let max=Math.max(...vals,1);
 let chart=months.map((m,i)=>`<div class="bar-group"><div class="bar" style="height:${vals[i]/max*100}%"></div><div class="bar alt" style="height:${Math.max(8,vals[i]/max*66)}%"></div><span class="bar-label">${m}</span></div>`).join('');
 return pageHead('OPERATIONS OVERVIEW','Your supply chain, at a glance','A live-style view of your sample business operations.',`<button class="btn" onclick="navigate('reports')">View reports ↗</button><button class="btn primary" onclick="openOrderModal()">＋ New order</button>`)+
 `<div class="grid kpis">
 ${kpi('Order value',money(revenue),'Across sample orders','₱')}
 ${kpi('Open orders',pending,'Awaiting fulfillment','▤')}
 ${kpi('Low-stock items',low,'Need replenishment','!')}
 ${kpi('Delivered shipments',delivered,'Completed demo deliveries','⇢')}
 </div><div class="grid two-col">
 ${card('Order value trend',`<div class="chart-wrap">${chart}</div><div class="legend"><span><i class="dot"></i>Order value</span><span><i class="dot alt"></i>Comparison index</span></div>`,`<small>Illustrative demo trend</small>`)}
 ${card('Inventory health',`<div class="list">${data.inventory.slice(0,5).map(i=>`<div class="list-row"><div class="item-main"><strong>${esc(i.name)}</strong><span>${i.stock} units · Reorder at ${i.reorder}</span></div>${status(i.stock<=i.reorder?'Low stock':'Healthy')}</div>`).join('')}</div>`,`<button class="btn" onclick="navigate('inventory')">Manage ↗</button>`)}
 ${card('Recent activity',`<div class="list">${data.activity.slice(0,4).map(a=>`<div class="list-row"><div class="item-main"><strong>${esc(a.title)}</strong><span>${esc(a.detail)}</span></div><span class="muted" style="font-size:10px">${esc(a.time)}</span></div>`).join('')}</div>`)}
 ${card('Fulfillment snapshot',`<div class="list">${['Pending','Processing','Packed','Completed'].map(s=>{let n=data.orders.filter(o=>o.status===s).length;return `<div class="list-row"><div class="item-main"><strong>${s}</strong><span>${n} orders</span></div><div style="width:42%;text-align:right"><div class="progress"><span style="width:${data.orders.length?n/data.orders.length*100:0}%"></span></div></div></div>`}).join('')}</div>`)}
 </div><p class="muted" style="font-size:10px;margin-top:18px">All figures and activity are fictional sample data for classroom demonstration.</p>`;
}
function kpi(label,value,note,icon){return `<div class="card"><div class="kpi-top">${label}<span class="kpi-icon">${icon}</span></div><div class="kpi-value">${value}</div><div class="kpi-note">${note}</div></div>`}
function inventoryPage(){return pageHead('STOCK CONTROL','Inventory','Monitor product quantities, suppliers, and reorder points.',`<button class="btn primary" onclick="openInventoryModal()">＋ Add product</button>`)+`<div class="grid kpis">${kpi('Products',data.inventory.length,'Active sample SKUs','▦')}${kpi('Total units',data.inventory.reduce((a,i)=>a+i.stock,0),'Across all products','◫')}${kpi('Low-stock items',data.inventory.filter(i=>i.stock<=i.reorder).length,'At or below reorder point','!')}${kpi('Stock value',money(data.inventory.reduce((a,i)=>a+i.stock*i.cost,0)),'Estimated cost value','₱')}</div><div class="card table-card"><div class="table-toolbar"><strong>Product catalog</strong><input class="search" id="inventorySearch" placeholder="Search products or SKU…" oninput="filterTable('inventoryTable',this.value)"></div><div class="table-scroll"><table id="inventoryTable"><thead><tr><th>Product</th><th>SKU</th><th>Category</th><th>On hand</th><th>Reorder point</th><th>Supplier</th><th>Stock status</th><th>Action</th></tr></thead><tbody>${data.inventory.map(i=>`<tr><td><strong>${esc(i.name)}</strong><span class="sub">${money(i.cost)} unit cost</span></td><td>${esc(i.id)}</td><td>${esc(i.category)}</td><td><strong>${i.stock}</strong></td><td>${i.reorder}</td><td>${esc(i.supplier)}</td><td>${status(i.stock<=i.reorder?'Low stock':'Healthy')}</td><td><button class="btn" onclick="adjustStock('${i.id}')">Adjust</button></td></tr>`).join('')}</tbody></table></div></div>`}

function customersPage(){return pageHead('RELATIONSHIP MANAGEMENT','Customers','A fictional customer directory linked to sample orders.',`<button class="btn primary" onclick="openCustomerModal()">＋ Add customer</button>`)+`<div class="grid kpis">${kpi('Customers',data.customers.length,'Demo customer profiles','♙')}${kpi('Orders placed',data.orders.length,'Across all customers','▤')}${kpi('Average order',money(data.orders.length?data.orders.reduce((a,o)=>a+o.total,0)/data.orders.length:0),'Sample average value','₱')}${kpi('Repeat customers',data.customers.filter(c=>c.orders>1).length,'More than one sample order','↻')}</div><div class="card table-card"><div class="table-toolbar"><strong>Customer directory</strong><input class="search" placeholder="Search name or company…" oninput="filterTable('customersTable',this.value)"></div><div class="table-scroll"><table id="customersTable"><thead><tr><th>Customer</th><th>Customer ID</th><th>Company</th><th>Email</th><th>Phone</th><th>Sample orders</th></tr></thead><tbody>${data.customers.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${c.id}</td><td>${esc(c.company)}</td><td>${esc(c.email)}</td><td>${esc(c.phone)}</td><td>${c.orders}</td></tr>`).join('')}</tbody></table></div></div><p class="muted" style="font-size:10px;margin-top:12px">Names, email addresses, and contact numbers are fictional placeholders.</p>`}
function deliveriesPage(){return pageHead('LOGISTICS & SHIPPING','Deliveries','Track simulated shipments from preparation to completion.',`<button class="btn primary" onclick="openDeliveryModal()">＋ Add shipment</button>`)+`<div class="grid kpis">${kpi('Shipments',data.deliveries.length,'Sample delivery records','⇢')}${kpi('Preparing',data.deliveries.filter(d=>d.status==='Preparing').length,'Awaiting dispatch','◷')}${kpi('In transit',data.deliveries.filter(d=>d.status==='In transit').length,'On simulated route','↗')}${kpi('Delivered',data.deliveries.filter(d=>d.status==='Delivered').length,'Completed sample shipments','✓')}</div><div class="grid two-col"><div class="card table-card"><div class="table-toolbar"><strong>Shipment register</strong><input class="search" placeholder="Search shipment…" oninput="filterTable('deliveryTable',this.value)"></div><div class="table-scroll"><table id="deliveryTable"><thead><tr><th>Shipment</th><th>Order / Customer</th><th>Destination</th><th>ETA</th><th>Status</th><th>Update</th></tr></thead><tbody>${data.deliveries.map(d=>`<tr><td><strong>${d.id}</strong><span class="sub">${esc(d.carrier)}</span></td><td>${d.order}<span class="sub">${esc(d.customer)}</span></td><td>${esc(d.destination)}</td><td>${d.eta}</td><td>${status(d.status)}</td><td><select onchange="updateDelivery('${d.id}',this.value)" style="padding:7px;border:1px solid var(--line);border-radius:8px">${['Preparing','In transit','Delivered','Delayed'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>${card('Delivery workflow',`<div class="list">${[['Preparing','Shipment details confirmed'],['In transit','Shipment dispatched (simulated)'],['Delivered','Order received (simulated)']].map((x,i)=>`<div class="list-row"><div class="item-main"><strong>${i+1}. ${x[0]}</strong><span>${x[1]}</span></div><span class="pill">Stage ${i+1}</span></div>`).join('')}</div><div class="notice" style="margin-top:14px">Tracking is simulated inside this prototype. No carrier or live GPS service is connected.</div>`)}</div>`}
const templates={
 stock:{name:'Inventory Risk Analyst',desc:'Low-stock and replenishment analysis',prompt:'You are an inventory risk analyst for a small supply chain operation. Review the inventory records below. Identify products at or below their reorder points, explain the operational risk, prioritize replenishment, and recommend practical next steps. Do not invent supplier lead times or stock data. Clearly label assumptions.\n\nINVENTORY DATA:\n{{inventory}}\n\nProvide: 1) risk summary, 2) prioritized replenishment list, 3) suggested actions, 4) missing information needed.'},
 orders:{name:'Order Prioritization Planner',desc:'Prioritize pending customer orders',prompt:'Act as a supply chain order-planning assistant. Review open orders and current inventory. Recommend a fulfillment sequence based on stated priority, order date, and stock availability. Flag conflicts and explain your reasoning. Do not assume stock is reserved unless the data says so.\n\nOPEN ORDERS:\n{{orders}}\n\nINVENTORY:\n{{inventory}}\n\nReturn a prioritized table, potential blockers, and recommended actions.'},
 delivery:{name:'Delivery Operations Planner',desc:'Review simulated shipments and ETAs',prompt:'Act as a logistics delivery planner. Review the shipment records. Identify shipments needing attention, compare current status with ETA, and recommend follow-up actions. Do not claim live tracking or infer a delay without evidence.\n\nSHIPMENTS:\n{{deliveries}}\n\nReturn: shipment overview, exceptions, recommended follow-ups, and information still needed.'},
 workflow:{name:'Process Improvement Consultant',desc:'Find workflow bottlenecks',prompt:'You are a supply chain process improvement consultant. Analyze the sample orders, inventory, and delivery records. Identify possible bottlenecks, explain the evidence, and recommend low-cost process improvements. Separate observed facts from assumptions.\n\nORDERS:\n{{orders}}\n\nINVENTORY:\n{{inventory}}\n\nDELIVERIES:\n{{deliveries}}\n\nProvide: key observations, root-cause hypotheses, prioritized improvements, and suggested performance measures.'}
};
function dataset(k){return JSON.stringify(data[k],null,2)}
function buildPrompt(){let p=templates[activeTemplate].prompt.replace('{{inventory}}',dataset('inventory')).replace('{{orders}}',dataset('orders')).replace('{{deliveries}}',dataset('deliveries'));return p}
function assistantPage(){let t=templates[activeTemplate];return pageHead('PROMPT ENGINEERING WORKSPACE','AI Prompt Lab','Build structured prompts using your sample operational data.',`<span class="pill">Prompt builder · No AI API connected</span>`)+`<div class="prompt-layout"><div class="card"><div class="card-head"><h3>Prompt templates</h3></div><div class="template-list">${Object.entries(templates).map(([k,v])=>`<button class="template ${k===activeTemplate?'active':''}" onclick="activeTemplate='${k}';renderPage()"><strong>${v.name}</strong><span>${v.desc}</span></button>`).join('')}</div><div class="notice" style="margin-top:16px">Choose a role-based template. LogiFlow inserts current demo records into the prompt.</div></div><div class="card"><div class="card-head"><div><h3>${t.name}</h3><small>${t.desc}</small></div><span class="pill">Structured prompt</span></div><div class="field" style="margin-bottom:12px"><label>Optional additional context</label><textarea id="extraContext" placeholder="Add a business goal, constraint, or scenario…"></textarea></div><div class="prompt-output" id="promptOutput">${esc(buildPrompt())}</div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="copyPrompt()">Copy prompt</button><button class="btn" onclick="savePrompt()">Save to prompt history</button><button class="btn" onclick="refreshPrompt()">Refresh data</button></div><div id="promptFeedback" class="muted" style="font-size:11px;margin-top:10px"></div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Prompt engineering checklist</h3><small>Use this to evaluate an AI response</small></div><div class="grid three-col"><div><strong>Role</strong><p class="muted">Does the prompt assign a clear expert perspective?</p></div><div><strong>Context</strong><p class="muted">Does it include relevant, current operational data?</p></div><div><strong>Output</strong><p class="muted">Does it specify a useful format and actionable result?</p></div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Saved prompt history</h3><button class="btn" onclick="clearPrompts()">Clear history</button></div><div id="promptHistory">${renderPromptHistory()}</div></div>`}
function getPromptHistory(){return JSON.parse(localStorage.getItem('lf3_prompts')||'[]')}
function renderPromptHistory(){let h=getPromptHistory();return h.length?`<div class="list">${h.map((x,i)=>`<div class="list-row"><div class="item-main"><strong>${esc(x.name)}</strong><span>${esc(x.date)}</span></div><button class="btn" onclick="copySavedPrompt(${i})">Copy</button></div>`).join('')}</div>`:'<div class="empty">No saved prompts yet. Save a prompt to build your library.</div>'}
function refreshPrompt(){document.getElementById('promptOutput').textContent=buildPrompt();document.getElementById('promptFeedback').textContent='Prompt refreshed with current sample data.'}
function copyPrompt(){let p=buildPrompt();let extra=document.getElementById('extraContext')?.value.trim();if(extra)p+='\n\nADDITIONAL CONTEXT:\n'+extra;navigator.clipboard?.writeText(p).then(()=>document.getElementById('promptFeedback').textContent='Prompt copied. Paste it into your chosen AI tool.').catch(()=>document.getElementById('promptFeedback').textContent='Select and copy the prompt manually.')}
function savePrompt(){let h=getPromptHistory();h.unshift({name:templates[activeTemplate].name,date:new Date().toLocaleString(),prompt:buildPrompt()});localStorage.setItem('lf3_prompts',JSON.stringify(h.slice(0,10)));document.getElementById('promptHistory').innerHTML=renderPromptHistory();document.getElementById('promptFeedback').textContent='Saved to this browser.'}
function copySavedPrompt(i){navigator.clipboard?.writeText(getPromptHistory()[i].prompt).then(()=>alert('Saved prompt copied.'))}
function clearPrompts(){if(confirm('Clear saved prompt history from this browser?')){localStorage.removeItem('lf3_prompts');document.getElementById('promptHistory').innerHTML=renderPromptHistory()}}
function reportsPage(){let total=data.orders.reduce((a,o)=>a+o.total,0),complete=data.orders.filter(o=>o.status==='Completed').length,rate=data.orders.length?Math.round(complete/data.orders.length*100):0;return pageHead('PERFORMANCE & INSIGHTS','Reports','Review sample business performance and export records.',`<button class="btn" onclick="exportCSV('orders')">Export orders CSV</button><button class="btn" onclick="exportCSV('inventory')">Export inventory CSV</button>`)+`<div class="grid kpis">${kpi('Order value',money(total),'All sample orders','₱')}${kpi('Fulfillment rate',rate+'%','Completed / all orders','✓')}${kpi('Average order',money(data.orders.length?total/data.orders.length:0),'Sample order value','↗')}${kpi('Stock at risk',data.inventory.filter(i=>i.stock<=i.reorder).length,'Products at reorder point','!')}</div><div class="grid two-col">${card('Order status distribution',`<div class="list">${['Pending','Processing','Packed','Completed','Cancelled'].map(s=>{let n=data.orders.filter(o=>o.status===s).length;return `<div class="list-row"><div class="item-main"><strong>${s}</strong><span>${n} orders</span></div><div style="width:48%"><div class="progress"><span style="width:${data.orders.length?n/data.orders.length*100:0}%"></span></div></div></div>`}).join('')}</div>`)}${card('Inventory replenishment watch',`<div class="list">${data.inventory.filter(i=>i.stock<=i.reorder).map(i=>`<div class="list-row"><div class="item-main"><strong>${esc(i.name)}</strong><span>${i.stock} on hand · ${i.reorder} reorder point</span></div>${status('Low stock')}</div>`).join('')||'<div class="empty">No products currently below reorder point.</div>'}</div>`)}</div><div class="notice" style="margin-top:16px">Reports are calculated from the fictional records stored in this browser. They are for demonstration and learning, not audited financial statements.</div>`}
function settingsPage(){return pageHead('WORKSPACE PERSONALIZATION','Settings','Customize LogiFlow’s brand, colors, navigation, and layout.',`<button class="btn" onclick="resetSettings()">Reset defaults</button><button class="btn primary" onclick="saveSettings()">Save customization</button>`)+`<div class="setting-layout"><div class="card"><div class="card-head"><h3>Brand identity</h3></div><div class="form-grid"><div class="field"><label>Workspace name</label><input id="sBrand" value="${esc(settings.brand)}"></div><div class="field"><label>Brand mark</label><input id="sMark" maxlength="4" value="${esc(settings.mark)}"></div><div class="field full"><label>Descriptor</label><input id="sDesc" value="${esc(settings.descriptor)}"></div><div class="field full"><label>Workspace label</label><input id="sWorkspace" value="${esc(settings.workspace)}"></div></div><div class="card-head" style="margin-top:22px"><h3>Custom color palette</h3><small>Enter HEX or use picker</small></div><div id="colorControls">${colorControl('primary','Primary color')}${colorControl('dark','Primary dark')}${colorControl('soft','Soft accent')}${colorControl('bg','Page background')}${colorControl('surface','Card surface')}${colorControl('text','Main text')}</div><div class="actions" style="margin-top:14px"><button class="btn soft" onclick="applySettingsPreview()">Apply live preview</button><button class="btn" onclick="preset('sage')">Sage & Cream</button><button class="btn" onclick="preset('forest')">Forest & Linen</button><button class="btn" onclick="preset('mono')">Warm Monochrome</button></div></div><div class="card"><div class="card-head"><h3>Live preview</h3><span class="pill">Preview</span></div><div class="preview" id="themePreview"><div class="preview-head" id="previewBrand">${esc(settings.brand)} · Workspace</div><div class="preview-body"><div class="preview-tile"><strong>Operational overview</strong><p class="muted">Your sample data at a glance.</p><span class="preview-button">View dashboard</span></div><div class="preview-tile"><strong>Inventory health</strong><p class="muted">24 units · Reorder point 30</p></div></div></div><div class="card-head" style="margin-top:22px"><h3>Layout preferences</h3></div><div class="field"><label>Navigation position</label><select id="sLayout"><option value="sidebar" ${settings.layout==='sidebar'?'selected':''}>Left sidebar</option><option value="top" ${settings.layout==='top'?'selected':''}>Top navigation</option></select></div><div class="field" style="margin-top:12px"><label>Spacing</label><select id="sSpacing"><option value="compact" ${settings.spacing==='compact'?'selected':''}>Compact</option><option value="comfortable" ${settings.spacing==='comfortable'?'selected':''}>Comfortable</option><option value="spacious" ${settings.spacing==='spacious'?'selected':''}>Spacious</option></select></div></div></div><div class="card" style="margin-top:16px"><div class="card-head"><h3>Navigation editor</h3><small>Rename, reorder, show, or hide items</small></div><div id="navEditor">${settings.nav.map((n,i)=>navEditorRow(n,i)).join('')}</div></div><div class="notice" style="margin-top:16px">Customization is saved in this browser only. This prototype does not include user accounts or server-side owner permissions.</div>`}
function colorControl(key,label){return `<div class="color-row"><strong style="font-size:11px">${label}</strong><input type="color" id="c_${key}" value="${settings[key]}" oninput="syncHex('${key}',this.value)"><input type="text" id="h_${key}" value="${settings[key]}" maxlength="7" oninput="syncPicker('${key}',this.value)" aria-label="${label} HEX"></div>`}
function syncHex(k,v){document.getElementById('h_'+k).value=v;applySettingsPreview()}
function syncPicker(k,v){if(/^#[0-9A-Fa-f]{6}$/.test(v)){document.getElementById('c_'+k).value=v;applySettingsPreview()}}
function navEditorRow(n,i){return `<div class="list-row" style="gap:8px"><input style="width:42px;padding:8px;border:1px solid var(--line);border-radius:8px" value="${esc(n[1])}" maxlength="3" onchange="settings.nav[${i}][1]=this.value"><input style="flex:1;min-width:100px;padding:8px;border:1px solid var(--line);border-radius:8px" value="${esc(n[2])}" onchange="settings.nav[${i}][2]=this.value"><label style="font-size:10px"><input type="checkbox" ${n[3]?'checked':''} onchange="settings.nav[${i}][3]=this.checked"> Show</label><button class="btn" onclick="moveNav(${i},-1)">↑</button><button class="btn" onclick="moveNav(${i},1)">↓</button></div>`}
function moveNav(i,d){let j=i+d;if(j<0||j>=settings.nav.length)return;[settings.nav[i],settings.nav[j]]=[settings.nav[j],settings.nav[i]];renderPage()}
function applySettingsPreview(){['primary','dark','soft','bg','surface','text'].forEach(k=>{let v=document.getElementById('h_'+k)?.value;if(v&&/^#[0-9A-Fa-f]{6}$/.test(v))settings[k]=v});settings.brand=document.getElementById('sBrand')?.value||settings.brand;settings.mark=document.getElementById('sMark')?.value||settings.mark;settings.descriptor=document.getElementById('sDesc')?.value||settings.descriptor;settings.workspace=document.getElementById('sWorkspace')?.value||settings.workspace;settings.layout=document.getElementById('sLayout')?.value||settings.layout;settings.spacing=document.getElementById('sSpacing')?.value||settings.spacing;applyTheme();document.getElementById('previewBrand').textContent=settings.brand+' · Workspace';let p=document.getElementById('themePreview');p.style.background=settings.bg;p.querySelector('.preview-head').style.background=settings.surface;p.querySelectorAll('.preview-tile').forEach(x=>{x.style.background=settings.surface;x.style.color=settings.text});p.querySelector('.preview-button').style.background=settings.dark}
function saveSettings(){applySettingsPreview();persist();renderPage();alert('Customization saved in this browser.')}
function preset(p){let vals=p==='sage'?['#788B76','#526650','#E7EDE3','#F7F5ED','#FFFEFA','#29332B']:p==='forest'?['#657C68','#354D3B','#E2EADF','#F2F1E8','#FFFDF7','#26352A']:['#8B8176','#5D554D','#EAE5DD','#F4F0E9','#FFFEFC','#332F2B'];['primary','dark','soft','bg','surface','text'].forEach((k,i)=>{settings[k]=vals[i];let c=document.getElementById('c_'+k),h=document.getElementById('h_'+k);if(c)c.value=vals[i];if(h)h.value=vals[i]});applySettingsPreview()}
function resetSettings(){if(!confirm('Reset all workspace customizations to the default Sage & Cream setup?'))return;settings=structuredClone(DEFAULTS);persist();applyTheme();renderPage()}
function filterTable(id,q){let el=document.getElementById(id);if(!el)return;let v=q.toLowerCase();el.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(v)?'':'none')}
function openModal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalBackdrop').classList.add('show')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show')}
function formField(label,id,placeholder='',type='text',full=false){return `<div class="field ${full?'full':''}"><label>${label}</label><input id="${id}" type="${type}" placeholder="${placeholder}" required></div>`}
function openInventoryModal(){openModal('Add inventory item',`<div class="form-grid">${formField('Product name','pName')}${formField('SKU / product code','pSku')}${formField('Category','pCat','e.g. Packaging')}${formField('Supplier','pSupplier')}${formField('Starting stock','pStock','0','number')}${formField('Reorder point','pReorder','0','number')}${formField('Unit cost (₱)','pCost','0','number')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="addInventory()">Add product</button></div>`)}
function addInventory(){let v={id:val('pSku'),name:val('pName'),category:val('pCat'),supplier:val('pSupplier'),stock:+val('pStock'),reorder:+val('pReorder'),cost:+val('pCost')};if(!v.id||!v.name)return alert('Please complete the required fields.');if(data.inventory.some(x=>x.id===v.id))return alert('That SKU already exists.');data.inventory.push(v);data.movements.push({id:v.id,change:v.stock,reason:'Opening stock'});activity('New product added: '+v.name,'Inventory · '+v.id);persist();closeModal();renderPage()}
function adjustStock(id){let i=data.inventory.find(x=>x.id===id);openModal('Adjust stock — '+i.name,`<div class="notice">Current quantity: <strong>${i.stock}</strong>. Enter a positive number to add stock or a negative number to reduce it.</div><div class="form-grid" style="margin-top:14px">${formField('Quantity change (+ / −)','adjQty','e.g. 10','number')}${formField('Reason','adjReason','e.g. Stock received')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="saveAdjustment('${id}')">Save adjustment</button></div>`)}
function saveAdjustment(id){let i=data.inventory.find(x=>x.id===id),n=+val('adjQty');if(!n)return alert('Enter a non-zero quantity.');if(i.stock+n<0)return alert('Stock cannot become negative.');i.stock+=n;data.movements.push({id,change:n,reason:val('adjReason')||'Manual adjustment'});activity('Stock adjusted: '+i.name,(n>0?'+':'')+n+' units');persist();closeModal();renderPage()}
function openCustomerModal(){openModal('Add fictional customer',`<div class="form-grid">${formField('Customer name','cuName')}${formField('Company','cuCompany')}${formField('Email (fictional)','cuEmail','name@example.test','email')}${formField('Phone (fictional)','cuPhone')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="addCustomer()">Add customer</button></div><p class="muted" style="font-size:10px">Use fictional placeholder information only.</p>`)}
function addCustomer(){let c={id:'CUS-'+(1000+data.customers.length+1),name:val('cuName'),company:val('cuCompany'),email:val('cuEmail'),phone:val('cuPhone'),orders:0};if(!c.name)return alert('Enter a customer name.');data.customers.push(c);persist();closeModal();renderPage()}
function openOrderModal(){let opts=data.customers.map(c=>`<option value="${esc(c.name)}"></option>`).join('');let prods=data.inventory.map(i=>`<option value="${i.id}">${esc(i.name)} (${i.stock} available)</option>`).join('');openModal('Create sample order',`<div class="form-grid"><div class="field"><label>Customer name</label><input id="oCustomer" list="oCustomerList" placeholder="Type a name or choose an existing customer" autocomplete="off"><datalist id="oCustomerList">${opts}</datalist><small style="color:var(--muted)">You can enter a new name here. New names are automatically added to Customer Directory.</small></div><div class="field"><label>Product</label><select id="oProduct">${prods}</select></div>${formField('Quantity','oQty','1','number')}${formField('Order date','oDate',new Date().toISOString().slice(0,10),'date')}<div class="field"><label>Priority</label><select id="oPriority"><option>Normal</option><option>High</option></select></div></div><div class="notice" style="margin-top:14px">Stock is deducted when the order is marked Processing or Packed, not when it is first created.</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="addOrder()">Create order</button></div>`)}
function addOrder(){let customer=val('oCustomer').trim(),prod=data.inventory.find(i=>i.id===val('oProduct')),qty=+val('oQty');if(!customer)return alert('Enter a customer name.');if(!prod||qty<1)return alert('Choose a product and valid quantity.');let c=data.customers.find(x=>x.name.toLowerCase()===customer.toLowerCase());if(!c){c={id:'CUS-'+(1001+data.customers.length),name:customer,company:'—',email:'—',phone:'—',orders:0};data.customers.push(c)}let o={id:'ORD-'+(2400+data.orders.length+1),customer:c.name,date:val('oDate')||new Date().toISOString().slice(0,10),items:prod.name+' × '+qty,total:prod.cost*qty,status:'Pending',priority:val('oPriority')};o.productId=prod.id;o.qty=qty;data.orders.push(o);c.orders++;activity('New order created: '+o.id,c.name+' · '+o.items);persist();closeModal();renderPage()}
function updateOrder(id,s){let o=data.orders.find(x=>x.id===id),old=o.status;if(['Processing','Packed','Completed'].includes(s)&&!o.stockDeducted&&o.productId){let p=data.inventory.find(x=>x.id===o.productId);if(p&&p.stock<o.qty){alert('Not enough stock. Order status was not changed.');renderPage();return}if(p){p.stock-=o.qty;o.stockDeducted=true;data.movements.push({id:p.id,change:-o.qty,reason:'Fulfillment '+o.id})}}if(s==='Cancelled'&&o.stockDeducted){let p=data.inventory.find(x=>x.id===o.productId);if(p)p.stock+=o.qty;o.stockDeducted=false}o.status=s;activity('Order '+id+' updated',old+' → '+s);persist();renderPage()}
function openDeliveryModal(){let opts=data.orders.map(o=>`<option value="${o.id}">${o.id} · ${esc(o.customer)}</option>`).join('');openModal('Add simulated shipment',`<div class="form-grid"><div class="field full"><label>Order</label><select id="dOrder">${opts}</select></div>${formField('Destination','dDest','City / area')}${formField('Estimated delivery','dEta','','date')}${formField('Demo carrier','dCarrier','e.g. SwiftRoute Demo')}</div><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="addDelivery()">Add shipment</button></div>`)}
function addDelivery(){let o=data.orders.find(x=>x.id===val('dOrder'));if(!o)return alert('Choose an order.');let d={id:'SHP-'+(8100+data.deliveries.length+1),order:o.id,customer:o.customer,destination:val('dDest'),eta:val('dEta'),carrier:val('dCarrier')||'Demo carrier',status:'Preparing'};data.deliveries.push(d);activity('Shipment created: '+d.id,o.id+' · '+d.destination);persist();closeModal();renderPage()}
function updateDelivery(id,s){let d=data.deliveries.find(x=>x.id===id);d.status=s;activity('Shipment '+id+' updated',s);persist();renderPage()}
function activity(title,detail){data.activity.unshift({title,detail,time:'Just now'});data.activity=data.activity.slice(0,12)}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function exportCSV(kind){let rows=data[kind];if(!rows.length)return alert('No records to export.');let cols=Object.keys(rows[0]),csv=[cols.join(','),...rows.map(r=>cols.map(k=>'"'+String(r[k]??'').replace(/"/g,'""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='logiflow-'+kind+'-demo.csv';a.click();URL.revokeObjectURL(a.href)}
function resetDemo(){if(!confirm('Restore the original fictional demo records? Your current browser demo data will be replaced.'))return;data=seedData();persist();renderPage()}
function renderPageWithReset(){}
applyTheme();renderNav();renderPage();
</script>
